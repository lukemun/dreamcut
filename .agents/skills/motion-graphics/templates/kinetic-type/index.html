<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="looks.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; background: transparent; overflow: hidden; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; color: var(--ink); }
      #phrase { position: absolute; color: var(--display-ink, var(--ink)); display: flex; flex-wrap: wrap; align-content: center; font-family: var(--display); font-weight: var(--display-weight); letter-spacing: var(--display-tracking); line-height: 1.02; }
      .word { display: inline-block; font-family: var(--display); font-style: var(--display-style, normal); text-transform: var(--display-case, none); white-space: nowrap; text-shadow: var(--separation); }
      .accent { color: var(--display-accent, var(--accent)); }
      .solo { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; align-items: center; }
      .glyphs { display: inline-block; transform-origin: 0 50%; }
      .echo { position: absolute; pointer-events: none; visibility: hidden; }
      .echo .word { display: block; margin: 0 !important; text-shadow: none; }
      .echo.outline .word { -webkit-text-fill-color: transparent; -webkit-text-stroke: max(2px, 0.025em) currentColor; }
      .hero { position: relative; transform-style: preserve-3d; }
      .slab { position: absolute; left: 0; top: 0; width: 100%; height: 100%; text-shadow: none; pointer-events: none; }
      .shine { color: transparent; -webkit-text-fill-color: transparent; background: linear-gradient(105deg, transparent 38%, rgba(255,255,255,0.6) 50%, transparent 62%) 120% 0 / 300% 100% no-repeat; -webkit-background-clip: text; background-clip: text; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080">
      <div id="phrase" data-actor="phrase"></div>
    </div>

    <script>
      // Values come from DreamCut at render time; defaults match dreamcut.controls.json.
      // Every motion added after the first version (whips, echoes, camera, 3D, flips) defaults to off,
      // and with it off the page is built exactly as before.
      const dc = window.__dreamcut ?? {
        controls: {
          look: "paper", shape: "wide", own_accent: false, accent: "#e4572e", backdrop: true,
          phrase: "Less time setting up. More time making the thing.", accent_words: "making",
          arrangement: "build", landing: "look", align: "left", size: 100, y: 50,
          lead_in: 0.3, beat: 0.32, word_times: "", word_time: 0.45, hold: 1.6,
          leave: "fade", leave_time: 0.2, whip_from: "right", overshoot: 0, smear: 0,
          echoes: 0, echo_gap: 0.03, echo_style: "outline", stretch: 100,
          drift: 0, camera: "push", kick: 0,
          hero_words: "", hero: "orbit", turn: 0, depth: 50,
          flip_words: "", flip_ground: "accent", motion_blur: 0,
        },
      };
      const c = dc.controls;
      const root = document.getElementById("root");
      const M = window.DreamcutMotion;
      const S = M.setup(c, root);
      const { u, tall, W, H } = S;
      const side = (tall ? 90 : 150) * u;
      const box = { width: W - side * 2, height: H * (tall ? 0.62 : 0.66) };
      // Height: where the phrase box is centred, as a share of the frame height, kept inside the frame.
      const boxTop = Math.max(0, Math.min(H - box.height, (H - box.height) / 2 + ((c.y ?? 50) - 50) / 100 * H));
      const phrase = document.getElementById("phrase");
      Object.assign(phrase.style, { left: side + "px", top: boxTop + "px", width: box.width + "px", height: box.height + "px",
        justifyContent: c.align === "center" ? "center" : "flex-start", textAlign: c.align === "center" ? "center" : "left" });

      const clean = (w) => w.toLowerCase().replace(/[^\p{L}\p{N}]/gu, "");
      const wordSet = (text) => new Set(String(text || "").split(/[,\s]+/).map(clean).filter(Boolean));
      const accents = wordSet(c.accent_words);
      const heroes = wordSet(c.hero_words);
      const flips = wordSet(c.flip_words);
      const words = String(c.phrase).trim().split(/\s+/).filter(Boolean).slice(0, 40);
      const one = c.arrangement === "one";

      // Exact word times ("0.3, 0.8, 1.1") follow music or speech; otherwise words land on an even beat.
      const given = String(c.word_times || "").split(/[ ,;]+/).map(Number).filter((t) => Number.isFinite(t) && t >= 0);
      const timeOf = (i) => given[i] ?? (given.length ? given[given.length - 1] + (i - given.length + 1) * c.beat : c.lead_in + i * c.beat);

      // Type stretched along its width: the letters scale inside the word, and the word's width follows them.
      const stretch = (c.stretch ?? 100) / 100;
      const stretched = stretch !== 1;
      const restretch = () => { if (stretched) for (const el of els) { el.style.width = ""; el.style.width = el.firstChild.offsetWidth * stretch + "px"; } };

      const scale = c.size / 100;
      const els = words.map((word) => {
        const el = document.createElement("span");
        el.className = "word" + (accents.has(clean(word)) ? " accent" : "");
        if (stretched) {
          const glyphs = document.createElement("span");
          glyphs.className = "glyphs";
          glyphs.style.transform = `scaleX(${stretch})`;
          glyphs.textContent = word;
          el.append(glyphs);
        } else el.textContent = word;
        return el;
      });
      if (one) {
        // One word at a time: each word as large as the box allows, up to the chosen size.
        const largest = (tall ? 300 : 280) * u * scale;
        for (const el of els) {
          const holder = document.createElement("div");
          holder.className = "solo";
          holder.style.justifyContent = c.align === "center" ? "center" : "flex-start";
          holder.append(el);
          phrase.append(holder);
          let size = largest;
          el.style.fontSize = size + "px";
          restretch();
          while (size > 40 * u && el.offsetWidth > box.width) { size *= 0.95; el.style.fontSize = size + "px"; restretch(); }
        }
      } else {
        // The phrase builds word by word into lines sized to fill the box.
        for (const el of els) { el.style.margin = "0 0.13em"; phrase.append(el); }
        let size = (tall ? 170 : 170) * u * scale;
        const fits = () => phrase.scrollHeight <= box.height + 1 && els.every((el) => el.offsetWidth <= box.width);
        phrase.style.fontSize = size + "px";
        restretch();
        while (size > 36 * u && !fits()) { size *= 0.95; phrase.style.fontSize = size + "px"; restretch(); }
      }

      // ---- measured once, before any tween moves a word -------------------------------------------
      const fontPx = (el) => parseFloat(getComputedStyle(el).fontSize);
      // The letter a zoom passes through: one with a hole (O, A, D...) nearest the middle, else the middle letter.
      const letterCentre = (el, frame) => {
        const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
        const node = walker.nextNode();
        const r = frame.getBoundingClientRect();
        if (!node || !node.length) return { x: r.width / 2, y: r.height / 2 };
        const text = node.textContent;
        const mid = (text.length - 1) / 2;
        let pick = Math.round(mid), best = Infinity;
        for (let k = 0; k < text.length; k++) {
          if (!/[oadbpqgeOADBPQRGe04689]/.test(text[k])) continue;
          if (Math.abs(k - mid) < best) { best = Math.abs(k - mid); pick = k; }
        }
        const range = document.createRange();
        range.setStart(node, pick);
        range.setEnd(node, pick + 1);
        const g = range.getBoundingClientRect();
        return { x: g.left + g.width / 2 - r.left, y: g.top + g.height * 0.55 - r.top };
      };
      const zoomOrigins = c.leave === "zoom" ? (one ? els.map((el) => letterCentre(el, el)) : null) : null;
      const phraseZoomOrigin = c.leave === "zoom" && !one ? (() => {
        const key = els.find((el) => el.classList.contains("accent")) || els[els.length - 1];
        return key ? letterCentre(key, phrase) : { x: box.width / 2, y: box.height / 2 };
      })() : null;

      const tl = gsap.timeline({ paused: true });
      const landing = c.landing === "look" ? S.look.motion : c.landing;
      const d = c.word_time;
      const end = timeOf(els.length - 1) + d + c.hold;
      const leaves = c.leave && c.leave !== "fade";
      const overshoot = Math.max(0, c.overshoot ?? 0) / 100;
      const smear = Math.max(0, c.smear ?? 0) / 100;
      // A settling ease that overshoots its mark and comes back, by the Overshoot amount; none is a clean stop.
      const settle = overshoot > 0 ? `back.out(${(0.4 + overshoot * 3.2).toFixed(2)})` : "expo.out";
      const WHIPS = { right: [1, 0], left: [-1, 0], below: [0, 1], above: [0, -1] };
      const whipOf = (i) => c.whip_from === "turns" ? WHIPS[["right", "left", "below", "above"][i % 4]] : WHIPS[c.whip_from] || WHIPS.right;
      const isHero = (i) => heroes.has(clean(words[i]));
      const fly = (i) => isHero(i) && c.hero === "fly";

      // When a word leaves: in one-at-a-time, just before the next word lands; the last word (and, in
      // Build the line, the whole phrase) leaves at the end when a Leaving move is chosen.
      const exitOf = (i) => {
        const at = timeOf(i);
        if (one && i < els.length - 1) {
          const next = timeOf(i + 1);
          const dur = Math.min(c.leave_time, Math.max(0.04, (next - at) * 0.6));
          return { start: Math.max(at + d * 0.5, next - dur), dur };
        }
        const dur = Math.min(c.leave_time, Math.max(0.04, c.hold * 0.8));
        return { start: end - dur, dur };
      };

      // A word arriving: `shift` delays the same move for an echo trailing it.
      function arrive(target, el, i, shift) {
        const at = timeOf(i) + shift;
        tl.set(target, { opacity: 0 }, 0).set(target, { opacity: 1 }, at);
        if (fly(i)) {
          // Flown in from deep behind the frame, toward the camera.
          const f = fontPx(el);
          tl.fromTo(el, { z: -9 * f, rotationY: c.turn }, { z: 0, rotationY: 0, duration: d * 1.4, ease: settle, immediateRender: true }, at);
          tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: d * 0.25, ease: "none", immediateRender: true }, at);
          return;
        }
        switch (landing) {
          case "drop": tl.fromTo(el, { y: -0.6 * fontPx(el), opacity: 0 }, { y: 0, opacity: 1, duration: d, ease: "bounce.out", immediateRender: true }, at); break;
          case "pop": tl.fromTo(el, { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: d, ease: "back.out(2.6)", immediateRender: true }, at); break;
          case "slide": tl.fromTo(el, { x: 80 * u, opacity: 0 }, { x: 0, opacity: 1, duration: d, ease: "expo.out", immediateRender: true }, at); break;
          case "rise": tl.fromTo(el, { y: 40 * u, opacity: 0 }, { y: 0, opacity: 1, duration: d, ease: "power3.out", immediateRender: true }, at); break;
          case "whip": {
            // Fast travel in from off the frame, settling with the chosen overshoot; Smear stretches it along the way.
            const [dx, dy] = whipOf(i);
            tl.fromTo(el, { x: dx * W * 0.95, y: dy * H * 0.75 }, { x: 0, y: 0, duration: d, ease: settle, immediateRender: true }, at);
            if (smear) tl.fromTo(el, dx ? { scaleX: 1 + smear } : { scaleY: 1 + smear }, { scaleX: 1, scaleY: 1, duration: d * 0.7, ease: "power2.out", immediateRender: true }, at);
            break;
          }
          case "punch":
            // Slams down from oversize; Overshoot lets it dip under its size and recover.
            tl.fromTo(el, { scale: 3.2 }, { scale: 1, duration: d, ease: settle, immediateRender: true }, at);
            tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: Math.min(0.05, d * 0.15), ease: "none", immediateRender: true }, at);
            break;
          default: M.enter(tl, el, at, d, S.look, { u });
        }
      }

      // A word leaving with the chosen Leaving move.
      function leave(target, el, i, shift) {
        const { start, dur } = exitOf(i);
        const at = start + shift;
        if (fly(i)) {
          // Flies on through the camera (its perspective is 4.5 font sizes; it passes just short of the lens).
          tl.to(el, { z: 4.3 * fontPx(el), duration: dur, ease: "power2.in" }, at);
          tl.to(el, { opacity: 0, duration: dur * 0.15, ease: "none" }, at + dur * 0.85);
          tl.set(target, { opacity: 0 }, at + dur);
          return;
        }
        switch (c.leave) {
          case "whip": {
            const [dx, dy] = whipOf(i);
            tl.to(el, { x: -dx * W * 0.95, y: -dy * H * 0.75, duration: dur, ease: "power3.in" }, at);
            if (smear) tl.to(el, { ...(dx ? { scaleX: 1 + smear } : { scaleY: 1 + smear }), duration: dur, ease: "power2.in" }, at);
            tl.set(target, { opacity: 0 }, at + dur);
            break;
          }
          case "zoom":
            // Through one of its letters: the word grows past the frame and the next word follows.
            tl.set(el, { transformOrigin: `${zoomOrigins[i].x}px ${zoomOrigins[i].y}px` }, at);
            tl.to(el, { scale: 42, duration: dur, ease: "power3.in" }, at);
            tl.to(target, { opacity: 0, duration: dur * 0.12, ease: "none" }, at + dur * 0.88);
            break;
          case "collapse":
            // Squashed to a line, then drawn into a point.
            tl.to(el, { scaleY: 0.04, duration: dur * 0.5, ease: "power3.in" }, at);
            tl.to(el, { scaleX: 0, duration: dur * 0.5, ease: "power3.in" }, at + dur * 0.5);
            tl.set(target, { opacity: 0 }, at + dur);
            break;
        }
      }

      // Strobe echoes: copies of the word trailing its moves by Echo gap, each fainter, shown only while it moves.
      function echo(el, i) {
        const count = Math.round(c.echoes || 0);
        if (!count || isHero(i)) return;
        const source = one ? el.parentNode : el;
        for (let k = count; k >= 1; k--) {
          const shell = document.createElement("div");
          shell.className = "echo" + (c.echo_style === "solid" ? "" : " outline");
          // Decorative copies of a word the layout check already reads; outlined copies are meant to have no fill.
          shell.setAttribute("aria-hidden", "true");
          shell.setAttribute("data-layout-ignore", "");
          shell.style.opacity = String(0.85 * (1 - k / (count + 1)));
          let target, copy;
          if (one) {
            Object.assign(shell.style, { left: 0, top: 0, right: 0, bottom: 0 });
            target = source.cloneNode(true);
            copy = target.firstChild;
          } else {
            Object.assign(shell.style, { left: el.offsetLeft + "px", top: el.offsetTop + "px", width: el.offsetWidth + "px", height: el.offsetHeight + "px" });
            target = document.createElement("div");
            copy = el.cloneNode(true);
            target.append(copy);
          }
          shell.append(target);
          source.before(shell);
          const shift = k * c.echo_gap;
          arrive(target, copy, i, shift);
          const at = timeOf(i) + shift;
          tl.set(shell, { visibility: "visible" }, at).set(shell, { visibility: "hidden" }, at + d * (fly(i) ? 1.4 : 1));
          if (leaves && (one || i === els.length - 1)) {
            const { start, dur } = exitOf(i);
            if (one) leave(target, copy, i, shift);
            tl.set(shell, { visibility: "visible" }, start + shift).set(shell, { visibility: "hidden" }, start + shift + dur);
          }
        }
      }

      // A 3D word: extruded slabs behind the face, lit by a highlight that sweeps as it turns.
      function hero(el, i) {
        const f = fontPx(el);
        el.classList.add("hero");
        gsap.set(el, { transformPerspective: f * (fly(i) ? 4.5 : 7) });
        const face = el.innerHTML;
        const layers = 28;
        const depth = f * 0.5 * Math.max(0, c.depth) / 100;
        const slabs = [];
        for (let k = layers; k >= 1; k--) {
          const slab = document.createElement("span");
          slab.className = "slab";
          slab.setAttribute("aria-hidden", "true");
          slab.setAttribute("data-layout-ignore", "");
          slab.innerHTML = face;
          // A light rim just behind the face, then the sides darken with depth.
          const mix = k === 1 ? "color-mix(in srgb, currentColor 70%, #fff)" : `color-mix(in srgb, currentColor ${Math.round(62 - 34 * (k / layers))}%, #000)`;
          slab.style.color = mix;
          slab.style.transform = `translateZ(${-(depth * k) / layers}px)`;
          slabs.push(slab);
        }
        const shine = document.createElement("span");
        shine.className = "slab shine";
        shine.setAttribute("aria-hidden", "true");
        shine.setAttribute("data-layout-ignore", "");
        shine.innerHTML = face;
        shine.style.transform = "translateZ(0.5px)";
        el.prepend(...slabs);
        el.append(shine);
        // Turned across its time on screen, from one side to the other.
        const at = timeOf(i);
        const until = leaves || fly(i) ? exitOf(i).start : (one && i < els.length - 1 ? timeOf(i + 1) : end);
        const span = Math.max(0.2, until - at);
        if (c.turn > 0 && !fly(i)) {
          tl.fromTo(el, { rotationY: -c.turn, rotationX: c.turn * 0.18 }, { rotationY: c.turn, rotationX: -c.turn * 0.12, duration: span, ease: "sine.inOut", immediateRender: true }, at);
        }
        tl.fromTo(shine, { backgroundPosition: "120% 0" }, { backgroundPosition: "-20% 0", duration: span, ease: "sine.inOut", immediateRender: true }, at);
      }

      // Measure echo positions and build 3D slabs before any tween moves a word.
      if (Math.round(c.echoes || 0) > 0) els.forEach((el, i) => echo(el, i));
      els.forEach((el, i) => { if (isHero(i)) hero(el, i); });

      els.forEach((el, i) => {
        const at = timeOf(i);
        const target = one ? el.parentNode : el;
        arrive(target, el, i, 0);
        if (one && i < els.length - 1) {
          // In one-at-a-time, each word clears just before the next lands.
          if (leaves || fly(i)) leave(target, el, i, 0);
          else tl.to(target, { opacity: 0, duration: Math.min(0.12, c.beat * 0.4), ease: "power1.in" }, Math.max(at + d * 0.5, timeOf(i + 1) - Math.min(0.12, c.beat * 0.4)));
        } else if (fly(i) || (one && leaves)) leave(target, el, i, 0);
      });
      // Build the line: the whole phrase leaves together at the end.
      if (!one && leaves) {
        const { start, dur } = exitOf(els.length - 1);
        switch (c.leave) {
          case "whip": {
            const [dx, dy] = whipOf(els.length - 1);
            tl.to(phrase, { x: -dx * W * 1.1, y: -dy * H * 0.9, duration: dur, ease: "power3.in" }, start);
            if (smear) tl.to(phrase, { ...(dx ? { scaleX: 1 + smear } : { scaleY: 1 + smear }), duration: dur, ease: "power2.in" }, start);
            break;
          }
          case "zoom":
            tl.set(phrase, { transformOrigin: `${phraseZoomOrigin.x}px ${phraseZoomOrigin.y}px` }, start);
            tl.to(phrase, { scale: 42, duration: dur, ease: "power3.in" }, start);
            tl.to(phrase, { opacity: 0, duration: dur * 0.12, ease: "none" }, start + dur * 0.88);
            break;
          case "collapse":
            tl.to(phrase, { scaleY: 0.04, duration: dur * 0.5, ease: "power3.in" }, start);
            tl.to(phrase, { scaleX: 0, duration: dur * 0.5, ease: "power3.in" }, start + dur * 0.5);
            tl.set(phrase, { opacity: 0 }, start + dur);
            break;
        }
      }

      // Colour flips: on chosen words the whole ground turns to the accent (or the ink) and the type to the
      // backdrop colour, until the next word lands.
      if (flips.size) {
        const css = getComputedStyle(root);
        const ink = css.getPropertyValue("--display-ink").trim() || css.getPropertyValue("--ink").trim();
        const accent = css.getPropertyValue("--display-accent").trim() || S.accent;
        const bg = css.getPropertyValue("--bg").trim() || "#ffffff";
        const ground = document.createElement("div");
        ground.style.cssText = "position:absolute;inset:0;opacity:0;pointer-events:none;";
        phrase.before(ground);
        const fill = c.flip_ground === "ink" ? ink : accent;
        const type = { "--display-ink": bg, "--display-accent": c.flip_ground === "ink" ? accent : bg };
        const back = { "--display-ink": ink, "--display-accent": accent };
        els.forEach((el, i) => {
          if (!flips.has(clean(words[i]))) return;
          const from = timeOf(i);
          const to = i < els.length - 1 ? timeOf(i + 1) : end;
          tl.set(ground, { opacity: 1, backgroundColor: fill }, from).set(root, type, from);
          tl.set(ground, { opacity: 0 }, to).set(root, back, to);
        });
      }

      tl.set({}, {}, end);

      // The camera: a slow drift across the phrase so no frame sits still, and a jolt on every word.
      const drift = Math.max(0, c.drift ?? 0) / 100;
      const kick = Math.max(0, c.kick ?? 0) / 100;
      if (drift || kick) {
        const cam = document.createElement("div");
        // The camera turns about the phrase, wherever Height puts it.
        cam.style.cssText = `position:absolute;inset:0;transform-origin:50% ${boxTop + box.height / 2}px;`;
        phrase.before(cam);
        cam.append(phrase);
        const T = tl.duration();
        const hits = els.map((_, i) => timeOf(i));
        const at = (t) => { let j = -1; for (let k = 0; k < hits.length; k++) if (hits[k] <= t) j = k; return j; };
        const place = (t) => {
          let x = 0, y = 0, r = 0, s = 1;
          const p = Math.min(1, t / T);
          switch (c.camera) {
            // Pushes move at a steady speed per second, so a long hold keeps moving as fast as a short beat.
            case "pull": s += 0.1 * drift * (T - t); r += 1.2 * drift * (T - t); break;
            case "beat": {
              const j = at(t);
              const from = j < 0 ? 0 : hits[j];
              s += 0.3 * drift * (t - from);
              r += (j % 2 ? 1 : -1) * 4 * drift * (t - from);
              break;
            }
            case "pan": x += (0.5 - p) * 0.09 * W * drift; r += (0.5 - p) * 1.2 * drift; s += 0.05 * drift; break;
            case "float":
              x += Math.sin(t * 1.3 + 0.4) * 0.016 * W * drift; y += Math.sin(t * 0.9) * 0.012 * H * drift;
              r += Math.sin(t * 0.7) * 1.3 * drift; s += 0.04 * drift + 0.02 * drift * Math.sin(t * 1.1);
              break;
            default: s += 0.1 * drift * t; r -= 1.2 * drift * t;
          }
          // Hit shake: a short decaying jolt from each word's landing.
          if (kick) hits.forEach((h, i) => {
            const dt = t - h;
            if (dt < 0 || dt > 0.7) return;
            const a = Math.exp(-dt * 9);
            s += 0.07 * kick * a;
            x += 0.012 * W * kick * a * Math.sin(dt * 52 + i * 2.1);
            y += 0.01 * H * kick * a * Math.cos(dt * 47 + i * 1.3);
            r += 1.8 * kick * a * Math.sin(dt * 38 + i * 1.7);
          });
          cam.style.transform = `translate(${x.toFixed(2)}px, ${y.toFixed(2)}px) rotate(${r.toFixed(3)}deg) scale(${s.toFixed(4)})`;
        };
        const state = { t: 0 };
        tl.fromTo(state, { t: 0 }, { t: T, duration: T, ease: "none", immediateRender: true, onUpdate: () => place(state.t) }, 0);
      }

      M.finish(tl, S);
