<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
    <!-- The scene: shapes, generators and camera moves (window.SKETCH_SCENE). Write a new scene.js for a new subject. -->
    <script src="scene.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; background: transparent; overflow: hidden; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      #scene { position: absolute; inset: 0; }
      #scene canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div id="scene" class="clip" data-start="0" data-duration="6" data-track-index="0" data-actor="scene"></div>
    </div>

    <script>
      // Values come from DreamCut at render time; defaults match dreamcut.controls.json.
      const dc = window.__dreamcut ?? {
        controls: {
          camera: "fly", density: 100, height: 100, detail: 70, wobble: 20, variation: 7,
          draw_in: 1.6, flight: 4, hold: 0.4, ink: "#1c1b19", paper: "#f3efe6", backdrop: true,
        },
      };
      const c = dc.controls;
      const sceneSpec = window.SKETCH_SCENE ?? { objects: [], camera: { moves: {} } };
      const W = 1920, H = 1080;
      const total = c.draw_in + c.flight + c.hold;
      const root = document.getElementById("root");
      const holder = document.getElementById("scene");
      root.dataset.duration = String(total);
      holder.dataset.duration = String(total);

      // Repeatable randomness: the same Variation always builds the same scene.
      let seed = (Math.round(c.variation) * 2654435761) >>> 0;
      const random = () => { seed += 0x6d2b79f5; let t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
      // A 2K/4K export renders at 2x device pixels; drawing at that ratio keeps the lines sharp instead of stretched.
      renderer.setPixelRatio(window.devicePixelRatio || 1);
      renderer.setSize(W, H, false);
      renderer.setClearColor(new THREE.Color(c.paper), c.backdrop ? 1 : 0);
      holder.append(renderer.domElement);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(sceneSpec.camera?.fov ?? 50, W / H, 0.1, 1000);
      const colour = (value, fallback) => new THREE.Color(value === "ink" || value == null ? fallback : value === "paper" ? c.paper : value);
      const inkFor = (spec) => new THREE.LineBasicMaterial({ color: colour(spec.line, c.ink) });
      // Faces are paper (or a fill colour) so nearer shapes hide the lines behind them, like a drawing.
      const faceFor = (spec) => new THREE.MeshBasicMaterial({ color: colour(spec.fill ?? "paper", c.paper), polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1,
        colorWrite: c.backdrop || (spec.fill != null && spec.fill !== "paper") });

      // Hand-drawn ink: every stroke is split into short steps that drift a little off the straight line.
      const wobbled = (positions) => {
        const amount = c.wobble / 100;
        if (amount <= 0) return positions;
        const out = [];
        for (let i = 0; i < positions.length; i += 6) {
          const a = new THREE.Vector3(positions[i], positions[i + 1], positions[i + 2]);
          const b = new THREE.Vector3(positions[i + 3], positions[i + 4], positions[i + 5]);
          const length = a.distanceTo(b);
          const steps = Math.max(1, Math.min(8, Math.round(length / 1.2)));
          const drift = length * 0.012 * amount;
          let previous = a;
          for (let s = 1; s <= steps; s++) {
            const point = a.clone().lerp(b, s / steps);
            if (s < steps) point.add(new THREE.Vector3((random() - 0.5) * drift, (random() - 0.5) * drift, (random() - 0.5) * drift));
            out.push(previous.x, previous.y, previous.z, point.x, point.y, point.z);
            previous = point;
          }
        }
        return out;
      };
      const strokes = (positions, spec) => {
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.Float32BufferAttribute(wobbled(positions), 3));
        return new THREE.LineSegments(geometry, inkFor(spec));
      };
      // Round shapes have no hard edges, so their outline is drawn as a thin ink shell behind them.
      const silhouette = (geometry, spec, thickness) => {
        const shell = geometry.clone();
        const position = shell.attributes.position, normal = shell.attributes.normal;
        for (let i = 0; i < position.count; i++) {
          position.setXYZ(i, position.getX(i) + normal.getX(i) * thickness, position.getY(i) + normal.getY(i) * thickness, position.getZ(i) + normal.getZ(i) * thickness);
        }
        return new THREE.Mesh(shell, new THREE.MeshBasicMaterial({ color: colour(spec.line, c.ink), side: THREE.BackSide }));
      };
      const edgesOf = (geometry, angle = 20) => [...new THREE.EdgesGeometry(geometry, angle).attributes.position.array];
      // Horizontal bands round a shape every `spacing` units (window floors, rings on a tower).
      const bandsAround = (outline, from, to, spacing) => {
        const out = [];
        if (!spacing || c.detail <= 0) return out;
        for (let y = from + spacing; y < to - spacing * 0.5; y += spacing) {
          if (random() * 100 > c.detail) continue;
          for (let i = 0; i < outline.length; i++) {
            const [x1, z1] = outline[i], [x2, z2] = outline[(i + 1) % outline.length];
            out.push(x1, y, z1, x2, y, z2);
          }
        }
        return out;
      };
      const ring = (radius, sides) => Array.from({ length: sides }, (_, i) => [Math.cos(i / sides * Math.PI * 2) * radius, Math.sin(i / sides * Math.PI * 2) * radius]);

      const actors = [];
      const add = (spec, build, order) => {
        const group = new THREE.Group();
        const [x, y, z] = spec.at ?? [0, 0, 0];
        group.position.set(x, y, z);
        group.rotation.y = THREE.MathUtils.degToRad(spec.turn ?? 0);
        build(group);
        scene.add(group);
        actors.push({ group, spec, order: spec.delay ?? order, appear: spec.appear ?? sceneSpec.appear ?? "rise" });
      };

      // Primitive shapes, all sitting on the ground at `at` unless lifted.
      const shapes = {
        box: (spec, order) => add(spec, (group) => {
          const [w, h, d] = spec.size ?? [1, 1, 1];
          const geometry = new THREE.BoxGeometry(w, h, d).translate(0, h / 2, 0);
          group.add(new THREE.Mesh(geometry, faceFor(spec)));
          const lift = 0.004, hw = w / 2 + lift, hd = d / 2 + lift;
          group.add(strokes([...edgesOf(geometry), ...bandsAround([[-hw, -hd], [hw, -hd], [hw, hd], [-hw, hd]], 0, h, spec.bands)], spec));
        }, order),
        cylinder: (spec, order) => add(spec, (group) => {
          const r = spec.radius ?? 0.5, h = spec.height ?? 1, sides = spec.sides ?? 24;
          const geometry = new THREE.CylinderGeometry(spec.top_radius ?? r, r, h, sides).translate(0, h / 2, 0);
          group.add(new THREE.Mesh(geometry, faceFor(spec)));
          group.add(silhouette(geometry, spec, 0.025 + r * 0.01));
          const outline = ring(r + 0.004, sides);
          const sides4 = [0, 0.25, 0.5, 0.75].map((f) => [Math.cos(f * Math.PI * 2) * r, Math.sin(f * Math.PI * 2) * r]);
          const verticals = sides4.flatMap(([px, pz]) => [px, 0, pz, px * (spec.top_radius ?? r) / r, h, pz * (spec.top_radius ?? r) / r]);
          group.add(strokes([...ringLines(outline, 0),...ringLines(ring((spec.top_radius ?? r) + 0.004, sides), h), ...verticals, ...bandsAround(outline, 0, h, spec.bands)], spec));
        }, order),
        cone: (spec, order) => shapes.cylinder({ ...spec, top_radius: 0.001 }, order),
        sphere: (spec, order) => add(spec, (group) => {
          const r = spec.radius ?? 0.5;
          const geometry = new THREE.SphereGeometry(r, 32, 16).translate(0, r, 0);
          group.add(new THREE.Mesh(geometry, faceFor(spec)));
          group.add(silhouette(geometry, spec, 0.025 + r * 0.01));
          const lines = [];
          const rings = spec.rings ?? 4;
          for (let i = 1; i <= rings; i++) {
            const a = -Math.PI / 2 + i / (rings + 1) * Math.PI;
            lines.push(...ringLines(ring(Math.cos(a) * r + 0.004, 40), r + Math.sin(a) * r));
          }
          group.add(strokes(lines, spec));
        }, order),
        // A flat outline (points across and up) pushed out into a slab: logos, letters, arrows, any silhouette.
        prism: (spec, order) => add(spec, (group) => {
          const outline = new THREE.Shape((spec.points ?? [[0, 0], [1, 0], [0, 1]]).map(([px, py]) => new THREE.Vector2(px, py)));
          const geometry = new THREE.ExtrudeGeometry(outline, { depth: spec.depth ?? 0.5, bevelEnabled: false });
          geometry.translate(0, 0, -(spec.depth ?? 0.5) / 2);
          group.add(new THREE.Mesh(geometry, faceFor(spec)));
          group.add(strokes(edgesOf(geometry, 30), spec));
        }, order),
        // A disc that always faces the camera: a sun, a moon, a marker.
        disc: (spec, order) => add(spec, (group) => {
          const r = spec.radius ?? 1;
          group.add(new THREE.Mesh(new THREE.CircleGeometry(r, 48), new THREE.MeshBasicMaterial({ color: colour(spec.fill ?? "#e4572e", c.ink) })));
          group.add(strokes(ringLines(ring(r, 48), 0, true), spec));
          group.userData.facesCamera = true;
        }, order),
        // Ground lines: a grid of streets or a plain horizon.
        ground: (spec, order) => add(spec, (group) => {
          const size = spec.size ?? 60, step = spec.grid ?? 6, lines = [];
          for (let v = -size / 2; v <= size / 2 + 1e-6; v += step) lines.push(-size / 2, 0, v, size / 2, 0, v, v, 0, -size / 2, v, 0, size / 2);
          group.add(strokes(lines, spec));
        }, order),
      };
      function ringLines(outline, y, flat = false) {
        const out = [];
        for (let i = 0; i < outline.length; i++) {
          const [x1, z1] = outline[i], [x2, z2] = outline[(i + 1) % outline.length];
          if (flat) out.push(x1, z1, 0.01, x2, z2, 0.01); else out.push(x1, y, z1, x2, y, z2);
        }
        return out;
      }

      // Generators make many shapes from a few numbers; Density and Height scale them.
      const generators = {
        city: (spec) => {
          const span = spec.span ?? 9, cell = spec.cell ?? 3;
          const lots = [];
          for (let gx = -span; gx <= span; gx++) for (let gz = -span; gz <= span; gz++) {
            if (spec.avenue !== false && gx === 0) continue;
            lots.push({ gx, gz, d: Math.hypot(gx * 0.8, gz) });
          }
          lots.sort((a, b) => a.d - b.d);
          const count = Math.min(lots.length, Math.round((spec.count ?? 150) * c.density / 100));
          const [ox, , oz] = spec.at ?? [0, 0, 0];
          for (let i = 0; i < count; i++) {
            const lot = lots[i];
            const centre = 1 - Math.min(1, lot.d / (span * 0.9));
            const tall = (3 + random() * 7 + Math.pow(random(), 2) * 14 * (0.4 + centre)) * (spec.height ?? 1) * c.height / 100;
            shapes.box({ size: [1.4 + random() * 1.2, tall, 1.4 + random() * 1.2], at: [ox + lot.gx * cell + (random() - 0.5) * 0.6, 0, oz + lot.gz * cell + (random() - 0.5) * 0.6],
              bands: spec.bands ?? 0.42, line: spec.line, fill: spec.fill, appear: spec.appear }, Math.min(1, lot.d / (span * 1.1)) * 0.6);
          }
        },
        forest: (spec) => {
          const count = Math.round((spec.count ?? 60) * c.density / 100), radius = spec.radius ?? 20;
          const [ox, , oz] = spec.at ?? [0, 0, 0];
          for (let i = 0; i < count; i++) {
            const a = random() * Math.PI * 2, d = Math.sqrt(random()) * radius, h = (2 + random() * 3) * c.height / 100;
            shapes.cone({ radius: 0.5 + random() * 0.5, height: h, sides: 10, at: [ox + Math.cos(a) * d, 0, oz + Math.sin(a) * d], line: spec.line, fill: spec.fill, appear: spec.appear }, d / radius * 0.6);
          }
        },
      };

      for (const [index, spec] of (sceneSpec.objects ?? []).entries()) {
        const order = Math.min(0.6, index / Math.max(1, (sceneSpec.objects ?? []).length) * 0.6);
        if (generators[spec.type]) generators[spec.type](spec);
        else if (shapes[spec.type]) shapes[spec.type](spec, order);
      }

      // Camera moves: keys of where the camera is and what it looks at, across the flight (at 0 to 1).
      const moves = sceneSpec.camera?.moves ?? {};
      const keys = moves[c.camera] ?? Object.values(moves)[0] ?? [{ at: 0, from: [20, 20, 20], to: [0, 0, 0] }];
      const ease = (t) => t * t * (3 - 2 * t);
      const lerp3 = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
      const view = (p) => {
        const progress = Math.max(0, Math.min(1, p));
        let i = 0;
        while (i < keys.length - 2 && progress > keys[i + 1].at) i++;
        const a = keys[i], b = keys[Math.min(i + 1, keys.length - 1)];
        const t = b === a || b.at === a.at ? 1 : ease(Math.max(0, Math.min(1, (progress - a.at) / (b.at - a.at))));
        return { from: lerp3(a.from, b.from, t), to: lerp3(a.to, b.to, t) };
      };

      const state = { grow: 0, flight: 0 };
      const draw = () => {
        // Shapes arrive in waves while the scene draws in: rising from the ground, growing, or simply appearing.
        for (const actor of actors) {
          const local = Math.max(0, Math.min(1, (state.grow - actor.order) / 0.4));
          const k = 1 - Math.pow(1 - local, 3);
          if (actor.appear === "rise") actor.group.scale.set(1, Math.max(0.001, k), 1);
          else if (actor.appear === "grow") actor.group.scale.setScalar(Math.max(0.001, k));
          else actor.group.visible = actor.appear === "none" || local > 0;
        }
        const { from, to } = view(state.flight);
        camera.position.set(...from);
        camera.lookAt(...to);
        for (const actor of actors) if (actor.group.userData.facesCamera) actor.group.lookAt(camera.position);
        renderer.render(scene, camera);
      };

      const tl = gsap.timeline({ paused: true, onUpdate: draw });
      tl.fromTo(state, { grow: 0 }, { grow: 1, duration: c.draw_in, ease: "none", immediateRender: true }, 0);
      tl.fromTo(state, { flight: 0 }, { flight: 1, duration: c.flight, ease: "none", immediateRender: true }, c.draw_in);
      tl.set({}, {}, total);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
      draw();
    </script>
  </body>
</html>
