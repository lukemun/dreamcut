<svg xmlns="http://www.w3.org/2000/svg" width="390" height="700" viewBox="0 0 390 700" role="img" aria-labelledby="title desc">
  <title id="title">Paragraph panel group layout</title>
  <desc id="desc">A stable left-aligned text container builds line by line while preserving its anchor.</desc>
  <rect width="390" height="700" rx="32" fill="#090b10"/>
  <rect x="30" y="56" width="330" height="588" rx="18" fill="#111621" stroke="#526077" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="195" y="31" fill="#f7f9fc" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">PARAGRAPH PANEL</text>
  <g stroke="#2f3a4e" stroke-width="1" opacity=".8"><path d="M140 56V644M250 56V644"/><path d="M30 173.6H360M30 291.2H360M30 408.8H360M30 526.4H360"/></g>
  <rect x="56" y="212" width="278" height="270" rx="18" fill="#f7f4ed" stroke="#111621" stroke-width="5"/>
  <g font-family="Inter,Arial,sans-serif" font-weight="750">
    <text x="82" y="274" fill="#111621" font-size="26">e.l.f. Beauty</text>
    <rect x="78" y="297" width="225" height="47" rx="8" fill="#ffd84d"/>
    <text x="82" y="330" fill="#111621" font-size="25">spent $400 million</text>
    <text x="82" y="384" fill="#111621" font-size="25">in marketing</text>
    <text x="82" y="426" fill="#111621" font-size="25">last year.</text>
  </g>
  <circle cx="56" cy="212" r="7" fill="#69e6b3"/>
  <text x="70" y="197" fill="#69e6b3" font-family="Inter,Arial,sans-serif" font-size="11">anchor: upper_left</text>
  <text x="195" y="525" fill="#92a2bd" font-family="Inter,Arial,sans-serif" font-size="12" text-anchor="middle">content grows; container anchor stays fixed</text>
</svg>
