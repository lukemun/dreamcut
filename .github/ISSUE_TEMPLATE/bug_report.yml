name: Bug report
description: Something in DreamCut doesn't work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Asked my agent to "…"
        2. Opened the proposal and …
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options: [Claude Code, Codex, None (editor only), Other]
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS (Apple Silicon), macOS (Intel), Windows, Linux]
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `node bin/dreamcut.mjs doctor`
      render: text
  - type: markdown
    attributes:
      value: Don't attach media you can't redistribute, credentials or private project files.
