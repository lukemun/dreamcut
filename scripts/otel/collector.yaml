# OpenTelemetry Collector Contrib. Local-only metadata, no cloud exporter.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  transform/metadata:
    error_mode: propagate
    log_statements:
      - context: log
        statements:
          - set(attributes["dreamcut.error"], true) where attributes["error.message"] != nil or attributes["error.type"] != nil
          - keep_keys(resource.attributes, ["service.name", "service.version", "deployment.environment"])
          - keep_keys(attributes, ["event.name", "event.kind", "conversation.id", "turn.id", "call_id", "tool_name", "tool", "model", "slug", "app.version", "duration_ms", "success", "attempt", "status", "decision", "source", "input_token_count", "output_token_count", "cached_token_count", "reasoning_token_count", "tool_token_count", "ttft_ms", "auth_mode", "model_reasoning_effort", "dreamcut.error", "dreamcut.run_id", "openedit.error", "openedit.run_id", "gen_ai.provider.name", "gen_ai.operation.name", "gen_ai.conversation.id", "gen_ai.request.model", "gen_ai.response.model", "gen_ai.response.id", "gen_ai.usage.input_tokens", "gen_ai.usage.output_tokens", "gen_ai.usage.cache_read.input_tokens", "gen_ai.usage.reasoning.output_tokens"])
          - set(body, "")
  batch:
    timeout: 1s
    send_batch_size: 128
exporters:
  file:
    path: ${env:DREAMCUT_OTEL_DIR}/logs.jsonl
    format: json
    rotation:
      max_megabytes: 100
      max_backups: 0
      max_days: 0
service:
  telemetry:
    logs:
      level: warn
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, transform/metadata, batch]
      exporters: [file]
